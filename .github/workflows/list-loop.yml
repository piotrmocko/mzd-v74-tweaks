name: List Loop tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tweak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Targeted change, rollback and isolation tests
        run: python3 tests/list-loop/run.py
      - name: Final result and critical cleanup contract
        run: python3 tests/list-loop/test_results.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve scrolling and wrap only at selectable boundaries
        run: node tests/list-loop/behavior.cjs
