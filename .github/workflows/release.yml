name: Release

# Publishes a ready-to-copy USB drive ZIP as a GitHub release.
#
#  - Push a tag X.Y.Z (release) or X.Y.Z-suffix (pre-release, e.g. 1.1.0-rc1) on a commit
#    that is on main. The release name and version are the tag.
#  - Or run it manually (Actions > Release > Run workflow) with the name of a tag that
#    already exists, e.g. to publish a tag that was pushed before this workflow existed.
#
# The ZIP also contains the OEM Android Auto Mods (android-auto.sh): the shims and the
# config files of the oem-aa-mod release pinned below are downloaded, checked against the
# release's SHA256SUMS and put into jci-shims/ (libpatch-*.so) and config/ (resources/*).
#
# The release notes list the commits since the previous tag and the contributors as
# @mentions (build/contributors.sh): ours for this release and those of the oem-aa-mod release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (X.Y.Z or X.Y.Z-suffix)'
        required: true

permissions:
  contents: write

env:
  # oem-aa-mod release that android-auto.sh installs. Change it here to ship another one.
  OEM_AA_MOD_REPO: VitaliyKurokhtin/oem-aa-mod
  OEM_AA_MOD_TAG: 0.10.0

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not X.Y.Z or X.Y.Z-suffix."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' does not exist."
            exit 1
          fi
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Tag '$TAG' ($sha) is not on main."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' already exists."
            exit 1
          fi
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          {
            echo "name=$TAG"
            echo "sha=$sha"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Download the OEM Android Auto Mods release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="oem-aa-mod-${OEM_AA_MOD_TAG}.zip"
          mkdir -p oem-aa-mod
          gh release download "$OEM_AA_MOD_TAG" -R "$OEM_AA_MOD_REPO" -D oem-aa-mod -p "$zip" -p SHA256SUMS
          # SHA256SUMS lists "./<file>"; check only the ZIP we use.
          (cd oem-aa-mod && grep -E "[ *](\./)?${zip}\$" SHA256SUMS | sed 's# \*\?\./# #' | sha256sum -c -)
          unzip -q "oem-aa-mod/$zip" -d oem-aa-mod
          src="oem-aa-mod/oem-aa-mod-${OEM_AA_MOD_TAG}"
          for f in libpatch-blmjciaapa.so libpatch-svcjcinavi.so libpatch-aap_service.so \
                   resources/libpatch.conf resources/aap_system_attributes.xml \
                   resources/aap_system_attributes_UCP.xml; do
            if [ ! -f "$src/$f" ]; then
              echo "::error::$f is missing from $zip"
              exit 1
            fi
          done
          echo "SRC=$src" >> "$GITHUB_ENV"

      - name: Package and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          SHA: ${{ steps.tag.outputs.sha }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p dist staging

          # Release notes: commits since the previous X.Y.Z(-suffix) tag (all commits for the first one).
          prev=$(git tag --merged "$SHA" --list '[0-9]*.[0-9]*.[0-9]*' |
            grep -Fxv "$TAG" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' |
            sort -V | tail -n 1 || true)
          range="$SHA"
          [ -n "$prev" ] && range="$prev..$SHA"

          # Contributors (commit authors and co-authors) as @mentions: GitHub shows them with
          # their avatars under the release. Our commits in this release, and everyone who
          # contributed to the included oem-aa-mod release.
          mentions() { sed 's/^/@/' | paste -sd, - | sed 's/,/, /g'; }
          contributors=$(sh build/contributors.sh "$GITHUB_REPOSITORY" "$SHA" "$prev" | mentions) ||
            { echo "::warning::Could not list the contributors"; contributors=""; }
          oem_contributors=$(sh build/contributors.sh "$OEM_AA_MOD_REPO" "$OEM_AA_MOD_TAG" | mentions) ||
            { echo "::warning::Could not list the oem-aa-mod contributors"; oem_contributors=""; }

          notes="dist/release-notes.md"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range"
            echo
            if [ -n "$contributors" ]; then
              echo "## Contributors"
              echo
              echo "$contributors"
              echo
            fi
            echo "## OEM Android Auto Mods"
            echo
            echo "Includes [OEM Android Auto Mods ${OEM_AA_MOD_TAG}](https://github.com/${OEM_AA_MOD_REPO}/releases/tag/${OEM_AA_MOD_TAG})${oem_contributors:+ by $oem_contributors}."
          } > "$notes"
          cat "$notes"

          package="staging/mzd-v74-tweaks-${TAG}"
          mkdir -p "$package"
          cp -R ./*.sh ./*.md5 jci-mods jci-org jci-shims "$package/"
          cp -R autorun/. "$package/"

          # OEM Android Auto Mods: shims next to ours, config files in config/, each with an .md5.
          cp "$SRC"/libpatch-*.so "$package/jci-shims/"
          mkdir -p "$package/config"
          cp "$SRC"/resources/* "$package/config/"
          for f in "$package"/jci-shims/libpatch-*.so "$package"/config/*; do
            (cd "$(dirname "$f")" && md5sum "$(basename "$f")" > "$(basename "$f").md5")
          done

          while IFS= read -r -d '' checksum; do
            if ! (cd "$(dirname "$checksum")" && md5sum -c "$(basename "$checksum")"); then
              echo "::error file=$checksum::checksum verification failed"
              exit 1
            fi
          done < <(find "$package" -type f -name '*.md5' -print0)

          archive="dist/mzd-v74-tweaks-${TAG}.zip"
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/$archive" .)
          unzip -l "$archive"

          prerelease_flag=""
          [ "$PRERELEASE" = "true" ] && prerelease_flag="--prerelease"
          gh release create "$TAG" "$archive" --title "$TAG" --notes-file "$notes" --verify-tag $prerelease_flag
