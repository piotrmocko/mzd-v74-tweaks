name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the Release workflow from the main branch."
            exit 1
          fi

          latest_tag=$(git tag --merged HEAD --list '[0-9]*.[0-9]*.[0-9]*' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$latest_tag" ]; then
            version=1.0.0
            commit_range=HEAD
          else
            commit_range="${latest_tag}..HEAD"
            subjects=$(git log --no-merges --format=%s "$commit_range")
            messages=$(git log --no-merges --format='%s%n%b' "$commit_range")
            if [ -z "$subjects" ]; then
              echo "::error::No non-merge commits since $latest_tag; there is nothing to release."
              exit 1
            fi

            IFS=. read -r major minor patch <<< "$latest_tag"
            major=$((10#$major))
            minor=$((10#$minor))
            patch=$((10#$patch))
            if printf '%s\n' "$messages" | grep -Eq '(^|[[:space:]])BREAKING CHANGE:' ||
              printf '%s\n' "$subjects" | grep -Eq '^[[:alnum:]-]+(\([^)]*\))?!:'; then
              major=$((major + 1))
              minor=0
              patch=0
            elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            version="${major}.${minor}.${patch}"
          fi

          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists."
            exit 1
          fi

          mkdir -p dist staging
          notes="dist/release-notes.md"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$commit_range"
          } > "$notes"
          if ! grep -q '^- ' "$notes"; then
            echo "::error::No non-merge commit messages found for the release notes."
            exit 1
          fi

          package="staging/mzd-v74-tweaks-${version}"
          mkdir -p "$package"
          cp -R ./*.sh ./*.md5 mp3title.txt js mp3 jci-mods jci-org jci-shims "$package/"
          cp -R autorun/. "$package/"

          while IFS= read -r -d '' checksum; do
            if ! (cd "$(dirname "$checksum")" && md5sum -c "$(basename "$checksum")"); then
              echo "::error file=$checksum::checksum verification failed"
              exit 1
            fi
          done < <(find "$package" -type f -name '*.md5' -print0)

          archive="dist/mzd-v74-tweaks-${version}.zip"
          (cd "$package" && zip -qr "$GITHUB_WORKSPACE/$archive" .)
          unzip -l "$archive"
          gh release create "$version" "$archive" --title "$version" --notes-file "$notes" --target "$GITHUB_SHA"
