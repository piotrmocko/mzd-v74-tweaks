name: CI

# Keeps the repo consistent:
#  - every *.md5 file matches its target file, so a changed installer, JS file or shim
#    cannot be merged without an updated md5 (the installers read these files),
#  - the patch scripts in jci-patches/ reproduce the jci-mods/ files from jci-org/,
#  - the shell scripts parse,
#  - the shims in jci-shims/ are exactly what mazda/patches/ builds to,
#  - tests/fuel-consumption/installer: fuel-consumption.sh simulated in busybox
#    (install, uninstall, damaged files, failed edits and restores, ...),
#  - tests/fuel-consumption/shim: the shims under qemu-arm against stand-in libraries.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate every .md5 file against its target
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            dir=$(dirname "$f")
            target="${f%.md5}"
            if [ ! -f "$target" ]; then
              echo "::error file=$f::target file $(basename "$target") is missing"
              fail=1
              continue
            fi
            want=$(cut -c1-32 "$f")
            got=$(md5sum "$target" | cut -c1-32)
            if [ "$want" != "$got" ]; then
              echo "::error file=$f::md5 mismatch for $target (file says $want, actual $got)"
              fail=1
            else
              echo "OK  $target  $got"
            fi
          done < <(find . -name '*.md5' -not -path './.git/*' -print0)
          echo "checked $count .md5 files"
          exit $fail

      - name: Every jci-mods / jci-org / jci-shims file has an .md5
        run: |
          set -euo pipefail
          fail=0
          for f in jci-mods/*.js jci-org/*.org jci-shims/*.so; do
            [ -e "$f" ] || continue
            if [ ! -f "$f.md5" ]; then
              echo "::error file=$f::missing $f.md5"
              fail=1
            fi
          done
          exit $fail

  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Patch scripts reproduce jci-mods from jci-org
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          python3 jci-patches/ecoenergyApp-patch.py jci-org/ecoenergyApp.js.org "$tmp/ecoenergyApp.js"
          python3 jci-patches/FuelConsumptionCtrl-patch.py jci-org/FuelConsumptionCtrl.js.org "$tmp/FuelConsumptionCtrl.js"
          cmp "$tmp/ecoenergyApp.js" jci-mods/ecoenergyApp.js
          cmp "$tmp/FuelConsumptionCtrl.js" jci-mods/FuelConsumptionCtrl.js
          echo "jci-patches output == jci-mods"

      - name: Modified JS files are valid JavaScript
        run: |
          set -euo pipefail
          for f in jci-mods/*.js; do node --check "$f" && echo "OK  $f"; done

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse (dash, like the head unit's busybox sh)
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -name '*.sh' -print | while IFS= read -r f; do
            dash -n "$f" && echo "OK  $f"
          done

      - name: Installer is ASCII with LF line endings
        run: |
          set -euo pipefail
          if LC_ALL=C grep -n '[^[:print:][:space:]]' fuel-consumption.sh; then
            echo "::error file=fuel-consumption.sh::non-ASCII characters"; exit 1
          fi
          if grep -q $'\r' fuel-consumption.sh; then
            echo "::error file=fuel-consumption.sh::CRLF line endings"; exit 1
          fi

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Simulate fuel-consumption.sh in busybox
        # /usb is a tmpfs mount, like the USB drive: the installer finds it in /proc/mounts.
        run: docker run --rm --tmpfs /usb -v "$PWD:/repo:ro" busybox:1.36 sh /repo/tests/fuel-consumption/installer/run.sh

  shims:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/m3-toolchain

      - name: Build shims and compare with jci-shims
        run: |
          set -euo pipefail
          cp -r jci-shims /tmp/jci-shims.committed
          sh build/build.sh
          for so in jci-shims/*.so; do
            file "$so" | grep -q 'ELF 32-bit.*ARM' || { echo "::error::$so is not an ARM shared object"; exit 1; }
          done
          if ! diff -r /tmp/jci-shims.committed jci-shims; then
            echo "::error::jci-shims/ does not match what mazda/patches/ builds to - run build/build.sh and commit the result"
            exit 1
          fi
          echo "jci-shims == build output"

      - name: Test the shims under qemu-arm
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          sh tests/fuel-consumption/shim/run.sh
