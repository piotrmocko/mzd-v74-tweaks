name: No List Beep tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tweak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Targeted change, rollback and isolation tests
        run: python3 tests/list-beep/run.py
      - name: Final result and critical cleanup contract
        run: python3 tests/list-beep/test_results.py
