<?xml version="1.0" encoding="UTF-8" ?>
<!-- Test stand-in for /jci/sm/sm_WCP.conf, NOT the Mazda file: only the parts fuel-consumption.sh reads. -->
<sm_config>
    <services>
        <service type="jci_service" name="jciBLMSettings" path="/jci/settings/svcjciblmsettings.so" autorun="yes" reset_board="yes" retry_count="0" args="">
            <dependency type="service" value="settings"/>
        </service>

        <service type="jci_service" name="jciMMUI" path="/jci/mmui/svcjcimmui.so" autorun="yes" reset_board="yes" retry_count="0" args="">
            <dependency type="service" value="jciBLMSettings"/>
            <dependency type="service" value="wcp"/>
        </service>
    </services>
</sm_config>
